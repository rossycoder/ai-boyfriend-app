name: Build APK (from zip)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip Flutter project
        run: unzip -o ai-boyfriend-flutter.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
      - name: Generate Android scaffolding if missing
        working-directory: ai-boyfriend-flutter
        run: |
          if [ ! -f android/gradlew ]; then
            cp pubspec.yaml /tmp/pubspec.bak
            cp -r lib /tmp/lib.bak
            cp -r assets /tmp/assets.bak
            flutter create --org com.rozeena --project-name ai_boyfriend --platforms=android .
            cp /tmp/pubspec.bak pubspec.yaml
            rm -rf lib assets
            cp -r /tmp/lib.bak lib
            cp -r /tmp/assets.bak assets
          fi
          sed -i 's/minSdkVersion .*/minSdkVersion 24/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 35/' android/app/build.gradle || true
          grep -q 'INTERNET' android/app/src/main/AndroidManifest.xml || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
      - name: Restore signing keystore
        working-directory: ai-boyfriend-flutter
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > upload-keystore.p12
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$STORE_PASSWORD
          keyAlias=upload
          storeFile=$GITHUB_WORKSPACE/ai-boyfriend-flutter/upload-keystore.p12
          EOF
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          if 'kpFile' not in s:
              s = s.replace('android {', """def kp = new Properties()
          def kpFile = rootProject.file('key.properties')
          if (kpFile.exists()) { kpFile.withReader('UTF-8') { r -> kp.load(r) } }
          android {
              signingConfigs {
                  release {
                      keyAlias kp['keyAlias']
                      keyPassword kp['keyPassword']
                      storeFile kp['storeFile'] ? file(kp['storeFile']) : null
                      storePassword kp['storePassword']
                  }
              }""", 1)
              s = s.replace('signingConfigs.debug', 'signingConfigs.release')
              p.write_text(s)
          print('signing injected:', 'signingConfigs' in p.read_text())
          PYEOF
          sha256sum upload-keystore.p12
          openssl pkcs12 -in upload-keystore.p12 -passin pass:"$STORE_PASSWORD" -nokeys -clcerts 2>/dev/null | grep -i subject || echo KEYSTORE_OPEN_FAILED
          ls -l upload-keystore.p12
      - name: Build APK and AAB
        working-directory: ai-boyfriend-flutter
        run: |
          sed -i 's/flutter_tts: .*/flutter_tts: 3.8.5/' pubspec.yaml
          grep flutter_tts pubspec.yaml
          flutter pub get
          flutter build apk --release
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: ai-boyfriend-release
          path: |
            ai-boyfriend-flutter/build/app/outputs/flutter-apk/app-release.apk
            ai-boyfriend-flutter/build/app/outputs/bundle/release/app-release.aab
      - name: Publish Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v1.4
          name: AI Partner APK v1.4
          files: |
            ai-boyfriend-flutter/build/app/outputs/flutter-apk/app-release.apk
            ai-boyfriend-flutter/build/app/outputs/bundle/release/app-release.aab
